<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICD-10-CM/PCS 代碼搜尋</title>
  <meta name="description" content="ICD-10-CM 診斷碼與 ICD-10-PCS 處置碼搜尋、自動完成工具，使用健保署與 CMS／CDC 官方公開資料，離線可用。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f4c5c'/%3E%3Ctext x='16' y='21.5' font-family='Consolas,monospace' font-size='13' font-weight='700' fill='%23fff' text-anchor='middle'%3E10%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">跳到主要內容</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">10</span>
        <span class="brand-name" data-i18n="appTitle">ICD-10-CM/PCS 代碼搜尋</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="search" data-i18n="navSearch">搜尋</a>
        <a href="#/browse" data-nav="browse" data-i18n="navBrowse">章節瀏覽</a>
        <a href="#/favorites" data-nav="favorites"><span data-i18n="navFavorites">我的最愛</span> <span class="nav-count" id="fav-count"></span></a>
        <a href="#/versions" data-nav="versions" data-i18n="navVersions">版本異動</a>
      </nav>
      <div class="top-tools">
        <label class="version">
          <span class="visually-hidden" data-i18n="versionLabel">資料版本</span>
          <select id="version-select"></select>
        </label>
        <button type="button" class="lang" id="lang-toggle">English</button>
      </div>
    </div>
    <div class="searchbar">
      <form class="search" id="search-form" role="search" autocomplete="off">
        <div class="combo">
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" spellcheck="false" autocapitalize="off"
                 role="combobox" aria-autocomplete="list" aria-expanded="false"
                 aria-controls="suggest" aria-label="搜尋 ICD-10 診斷碼與處置碼">
          <kbd class="kbd-hint" aria-hidden="true">/</kbd>
          <ul id="suggest" class="suggest" role="listbox" hidden></ul>
        </div>
        <button type="submit" class="search-btn" data-i18n="searchButton">搜尋</button>
      </form>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <p class="loading" id="loading">正在載入 ICD-10 資料…</p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="footer"><p id="footer-text"></p></footer>

  <script src="js/i18n.js"></script>
  <script src="js/merge.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sync.js"></script>
  <script src="dict/abbreviations.js"></script>
  <script src="js/core.js"></script>
  <script src="data/versions.js"></script>
  <script src="data/changes.js"></script>
  <!-- The selected version's data file (data/icd10cm-<id>.js) is loaded on demand by app.js. -->
  <script src="js/app.js" defer></script>
</body>
</html>
